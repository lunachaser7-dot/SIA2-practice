<!DOCTYPE html>
<html>

<head>
    <title>Add Transaction</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="add-transaction-page">

<div class="add-transaction-container">

    <div class="transaction-card">

        <div class="card-header">
            <h1>Add Transaction</h1>
            <p class="muted">Record income or expenses to keep your church finances up to date.</p>
        </div>

        <form id="transactionForm" class="transaction-form">

            <label for="type">Type</label>
            <select id="type" required>
                <option value="Income">Income</option>
                <option value="Expense">Expense</option>
            </select>

            <label for="category">Category</label>
            <input type="text" id="category" placeholder="e.g., Tithes, Utilities" required>

            <label for="amount">Amount</label>
            <input type="number" id="amount" placeholder="0.00" step="0.01" required>

            <label for="description">Description</label>
            <textarea id="description" placeholder="Notes (optional)"></textarea>

            <div class="form-actions">
                <button type="submit">Save Transaction</button>
            </div>

        </form>

    </div>

</div>

<script src="/config.js"></script>
<script src="js/addtransaction.js"></script>

</body>

</html>
